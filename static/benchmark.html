<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highway rendering benchmark</title>
<style>
  body { margin: 20px; background: #0b1018; color: #dce9ef; font: 14px system-ui; }
  button { padding: 8px 16px; margin-right: 12px; }
  #stage { position: relative; width: min(1280px, 100%); height: 720px; }
  #stage canvas { position: absolute; width: 100%; height: 100%; }
  pre { white-space: pre-wrap; }
</style>
<h1>Highway rendering benchmark</h1>
<p>Ten seconds of a dense five-string chart at a fixed size. Keep this tab visible.
Repeat while resizing or playing video in another window to compare frame pacing.
CPU submission time excludes GPU execution. Results depend on the browser and hardware.</p>
<button id="run">Run benchmark</button><span id="status">Ready</span>
<pre id="results"></pre><section id="stage" aria-label="Benchmark highway"></section>
<script type="module" src="/benchmark.js"></script>
</html>
